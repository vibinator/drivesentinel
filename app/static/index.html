<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DriveSentinel</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect x='2' y='2' width='20' height='20' rx='6' fill='%233b5bfd'/><rect x='6' y='7' width='12' height='10' rx='2' fill='none' stroke='white' stroke-width='1.8'/><circle cx='14.5' cy='12' r='1.6' fill='white'/></svg>">
  <script>try { const t = localStorage.getItem("ds-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">
      <span class="brand-mark"><svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><rect x="3.5" y="5.5" width="17" height="13" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="15.5" cy="12" r="2" fill="currentColor"/><path d="M7.5 9.5h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>
      DriveSentinel
    </a>
    <nav>
      <a href="#/" data-nav="dash">Drives</a>
      <a href="#/events" data-nav="events">Events</a>
      <a href="#/settings" data-nav="settings">Settings</a>
    </nav>
    <div class="topbar-right">
      <span id="scanInfo" class="muted small live"></span>
      <button id="themeBtn" class="btn ghost icon-btn" title="Toggle theme" aria-label="Toggle theme"></button>
      <button id="scanBtn" class="btn primary"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>Scan now</button>
    </div>
  </header>
  <div id="banner"></div>
  <main id="view"><div class="cards"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div></main>
  <div id="toast"></div>
  <script src="/static/app.js"></script>
</body>
</html>
